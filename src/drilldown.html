<style>
.document-dialog{width:min(850px,95vw);height:auto;max-height:88vh}.document-layout{height:auto}.document-dialog iframe{display:none!important}.doc-help{padding:22px;line-height:1.8;font-size:14px}.document-actions a{background:#e4bb68;color:#172435;font-weight:750}.document-actions select{max-width:100%;width:100%}.document-head{background:linear-gradient(125deg,#243e55,#152232)}
.depth-trail{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:18px}.depth-trail button{font-size:10px;padding:4px 7px;background:#1b3042}.depth-trail span{font-size:10px;color:#e7c484;padding:4px}.depth-choice{display:block;width:100%;text-align:left;margin:9px 0;padding:14px;background:linear-gradient(120deg,#283e52,#203044);border-color:#51677c;box-shadow:0 4px 12px #0002}.depth-choice strong{font-size:14px;display:block;color:#f2d9a7}.depth-choice small{display:block;font-size:12px;line-height:1.5;color:#c0cede;margin-top:4px}.depth-choice:hover{transform:translateX(3px);border-color:#e7c484}.depth-eyebrow{font-size:10px;text-transform:uppercase;color:#dcb879;letter-spacing:.13em}.depth-reading{background:#fbf7ed;color:#233448;padding:19px;border-radius:3px;box-shadow:3px 7px 14px #0003;margin:12px 0}.depth-reading p{color:#27384a;font-size:14px;line-height:1.85}.depth-reading h4{color:#163047;margin-top:0}.depth-reading .ref{color:#174c7c;border-color:#8a9dae}.official-link{display:block;background:#ead5aa;color:#142c42!important;border-radius:7px;padding:14px;margin:12px 0;text-decoration:none;font-weight:750;font-size:14px}.official-link small{display:block;font-weight:400;font-size:11px;margin-top:5px}.official-link:hover{background:#ffe8b9}.official-card{border:1px solid #657b89;padding:15px;border-radius:8px;margin:14px 0;background:#1c3142}.official-card h4{font-size:15px;margin:0 0 10px}.official-card code{overflow-wrap:anywhere;font-size:12px;color:#f3d5a0}.depth-section{border-top:1px solid #506176;padding-top:16px;margin-top:20px}.inspector{scroll-behavior:smooth}.inspector .cover{object-position:center 25%}.depth-back{font-size:12px;margin-bottom:12px}.inspector .depth-entry{background:#314c63;border-color:#7a94a7}.depth-count{font-size:11px;color:#9fb4c8;margin-top:5px}.asset-caption{font-size:10px!important;color:#aab9ca!important}.inspector:focus{outline:none}@media(prefers-reduced-motion:reduce){.depth-choice,.inspector{transition:none;scroll-behavior:auto}}@media(max-width:760px){.inspector{max-height:85vh;overflow:auto}.depth-reading p{font-size:15px}}
</style>
<script>
const depthGroups=[['material','1 · Identificar a prova','Documento, autor e significado de cada informação.'],['claim','2 · Entender a acusação','Como este material foi usado para ligar as pessoas.'],['limits','3 · Examinar a controvérsia','Defesa, lacunas e interpretações possíveis.'],['outcome','4 · Entender a decisão','Qual ato foi anulado e o que aconteceu com o caso.']];
let depthEvidence=null,depthOrigin=null,depthGroup=null;
function depthChoice(title,sub,fn){let b=document.createElement('button');b.className='depth-choice';b.innerHTML=`<strong>${esc(title)} →</strong><small>${esc(sub||'')}</small>`;b.onclick=fn;return b}
function depthTop(title,level,back){const p=$('inspector');p.innerHTML='';let crumbs=document.createElement('div');crumbs.className='depth-trail';if(chainRoot){let b=document.createElement('button');b.textContent=byId[chainRoot].name;b.onclick=()=>selectNode(chainRoot,true);crumbs.append(b)}if(depthOrigin){let b=document.createElement('button');b.textContent=depthOrigin;b.onclick=()=>selectEdge(depthOrigin);crumbs.append(b)}if(depthEvidence){let b=document.createElement('button');b.textContent=depthEvidence.id;b.onclick=()=>showEvidenceMenu(depthEvidence.id,false);crumbs.append(b)}let label=document.createElement('span');label.textContent=level;crumbs.append(label);p.append(crumbs);if(back){let b=document.createElement('button');b.className='depth-back';b.textContent='← Voltar uma etapa';b.onclick=back;p.append(b)}p.insertAdjacentHTML('beforeend',`<div class="depth-eyebrow">${esc(level)}</div><h3>${esc(title)}</h3>`);p.scrollTop=0;p.setAttribute('tabindex','-1');return p}
function evidenceTopics(e,group){let c=D.cases[e.case],topics=[];const add=(title,text,sources)=>topics.push({title,text,sources});if(group==='material'){add('O que é este material?',e.content,e.sources);add(e.guide.title,e.guide.text,e.sources);if(e.id==='E09')D.chapters[4].parts.slice(0,4).forEach(([t,b])=>add(t,b,D.chapters[4].sources))}
if(group==='claim'){add('Qual ligação a acusação procurou demonstrar?',e.claim,e.sources);const ix=e.case==='Sítio'?2:e.case==='Triplex'?3:e.case==='Dirceu'?7:1;D.chapters[ix].parts.slice(0,e.case==='Dirceu'?1:4).forEach(([t,b])=>add(t,b,D.chapters[ix].sources))}
if(group==='limits'){add('O que esta prova não resolve sozinha?',e.limit,e.sources);add('Da obra ou pagamento à responsabilidade individual',D.chapters[8].parts[2][1],D.chapters[8].sources);if(e.id==='E09'){D.chapters[5].parts.slice(3).forEach(([t,b])=>add(t,b,D.chapters[5].sources))}else if(['Sítio','Triplex'].includes(e.case)){add('Qual foi a controvérsia?',D.chapters[e.case==='Triplex'?3:2].parts[e.case==='Triplex'?1:3][1],e.sources)}}
if(group==='outcome'){add('Qual é o desfecho desta ficha?',e.status,e.sources);let ix=['Odebrecht','Instituto'].includes(e.case)?5:e.case==='Dirceu'?7:6;D.chapters[ix].parts.forEach(([t,b])=>add(t,b,D.chapters[ix].sources))}return topics}
function showEvidenceMenu(id,capture=true){let e=D.evidence.find(x=>x.id===id);if(capture)depthOrigin=selectedType==='edge'?selected:null;depthEvidence=e;depthGroup=null;let p=depthTop(e.title,'3 / Ficha de evidência',depthOrigin?()=>selectEdge(depthOrigin):null);p.insertAdjacentHTML('beforeend',`<p>${esc(e.id+' · '+e.case+' · '+e.type)}</p><div class="${id==='E09'?'stamp':'status'}">${esc(e.status)}</div>`);depthGroups.forEach(([key,title,sub])=>p.append(depthChoice(title,sub,()=>showGroup(key))));p.append(depthChoice('5 · Checar a papelada','Documento citado e processo no portal oficial.',()=>showOfficial(e.case,()=>showEvidenceMenu(id,false))));if(window.matchMedia('(max-width:760px)').matches)p.scrollIntoView({behavior:'smooth',block:'start'})}
function showGroup(group){depthGroup=group;let e=depthEvidence,topics=evidenceTopics(e,group),p=depthTop(depthGroups.find(g=>g[0]===group)[1],'4 / Perguntas específicas',()=>showEvidenceMenu(e.id,false));p.insertAdjacentHTML('beforeend',`<p>${esc(e.title)}</p><div class="depth-count">${topics.length} explicações disponíveis neste ramo</div>`);topics.forEach((t,i)=>p.append(depthChoice(t.title,'Abrir explicação, referências e caminho aos autos.',()=>showTopic(group,i))))}
function showTopic(group,index){let e=depthEvidence,t=evidenceTopics(e,group)[index],p=depthTop(t.title,'5 / Explicação e origem',()=>showGroup(group));p.insertAdjacentHTML('beforeend',`<article class="depth-reading"><p>${esc(t.text)}</p><h4>Fontes desta explicação</h4>${refs(t.sources)}</article>`);p.append(depthChoice('Abrir a documentação deste caso','Número do processo, tribunal e documentos originais.',()=>showOfficial(e.case,()=>showTopic(group,index))));p.append(depthChoice('Outra pergunta sobre esta prova','Voltar aos assuntos da ficha '+e.id+'.',()=>showEvidenceMenu(e.id,false)))}
function officialAnchor(id,label){let s=D.sources[id];return `<a class="official-link" href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(label||s.title)} ↗<small>${esc(s.kind)} · abre diretamente em outra aba</small></a>`}
function showOfficial(caseName,back){let c=D.cases[caseName],p=depthTop(c.title,'6 / Documentos e processo oficial',back);p.insertAdjacentHTML('beforeend',`<div class="official-card"><h4>${esc(c.court)}</h4><code>${esc(c.number)}</code><p>${esc(c.note)}</p>${officialAnchor(c.portal,'Abrir a página do processo no tribunal')}</div><p>Na consulta, procure os andamentos e as decisões. O acesso a anexos pode depender de login ou sigilo. Os links abaixo distinguem peças originais de cópias públicas.</p><h4>Peças para ler agora</h4>`);let ids=[...new Set([...c.documents,...c.rulings])];ids.forEach(id=>p.insertAdjacentHTML('beforeend',officialAnchor(id)));if(depthEvidence?.id==='E11')p.insertAdjacentHTML('afterbegin',officialAnchor('dojdoc','Abrir o documento original no Departamento de Justiça dos EUA'));p.insertAdjacentHTML('beforeend','<p class="paper-note">O site abre a fonte diretamente; não tenta contornar restrições do tribunal nem baixar os autos. Se um portal estiver indisponível, tente novamente pela própria página oficial. Notícias explicativas não são apresentadas como autos.</p>')}
function casesForEdges(es){let result=new Set;es.forEach(e=>e.evidence.forEach(id=>result.add(D.evidence.find(x=>x.id===id).case)));return [...result]}
const chainSelectNode=selectNode,chainSelectEdge=selectEdge;
selectNode=function(id,keep=false){depthEvidence=null;depthOrigin=null;chainSelectNode(id,keep);let p=$('inspector'),es=D.edges.filter(e=>e.a===id||e.b===id),cs=casesForEdges(es);if(cs.length){let section=document.createElement('section');section.className='depth-section';section.innerHTML='<h4>Investigar por processo</h4><p>Escolha o caso para aprofundar provas, penas e decisões.</p>';cs.forEach(k=>section.append(depthChoice(k,'Abrir os conjuntos de provas deste caso.',()=>showCase(k,id))));p.append(section)}let a=asset(byId[id]);if(a)p.insertAdjacentHTML('beforeend',`<p class="asset-caption">Imagem: ${esc(a.alt)}. ${esc(a.author||a.credit||'Crédito na seção de imagens.')}</p>`);p.scrollTop=0};
selectEdge=function(id){depthEvidence=null;depthOrigin=id;chainSelectEdge(id);let e=D.edges.find(x=>x.id===id),p=$('inspector');let buttons=p.querySelectorAll('[data-evidence]');buttons.forEach(b=>{let ev=D.evidence.find(x=>x.id===b.dataset.evidence);b.classList.add('depth-entry');b.innerHTML=`${esc(ev.id)} · ${esc(ev.title)}<br><strong>Investigar em profundidade →</strong>`;b.onclick=()=>showEvidenceMenu(ev.id)});if(!e.evidence.length)p.insertAdjacentHTML('beforeend','<p class="paper-note">Este fio registra um vínculo. Não possui uma ficha própria de acusação criminal. Veja a fonte do vínculo antes de avançar para outro caso.</p>');p.scrollTop=0};
function showCase(k,nodeId){depthEvidence=null;let c=D.cases[k],p=depthTop(c.title,'2 / Escolha a evidência',()=>selectNode(nodeId,true));p.insertAdjacentHTML('beforeend',`<p>${esc(c.number)}</p>`);D.evidence.filter(e=>e.case===k).forEach(e=>p.append(depthChoice(e.title,e.type,()=>showEvidenceMenu(e.id,false))));let penalties=D.penalties.filter(x=>k==='Dirceu'?x[0]==='José Dirceu':x[1]===k);penalties.forEach(x=>p.append(depthChoice('Pena e prisão · '+x[0]+' / '+x[1],x[2],()=>{let q=depthTop(x[0]+' · '+x[1],'4 / Pena, custódia e desfecho',()=>showCase(k,nodeId));q.insertAdjacentHTML('beforeend',`<article class="depth-reading"><h4>Penas sucessivas</h4><p>${esc(x[2])}</p><h4>Prisão efetiva</h4><p>${esc(x[3])}</p><h4>Desfecho</h4><p>${esc(x[4])}</p>${refs(x[5])}</article>`);q.append(depthChoice('Consultar os documentos deste caso','Processo oficial e decisões relacionadas.',()=>showOfficial(k,()=>showCase(k,nodeId))))})));p.append(depthChoice('Ir aos documentos oficiais',c.court,()=>showOfficial(k,()=>showCase(k,nodeId))))}
openEvidence=function(id){showEvidenceMenu(id);$('boardShell').scrollIntoView({behavior:'smooth',block:'start'})};
D.evidence.forEach(e=>{const body=$(e.id).querySelector('.evidence-body');body.insertAdjacentHTML('beforeend',`<h4>${esc(e.guide.title)}</h4><p>${esc(e.guide.text)}</p>`);body.append(depthChoice('Abrir investigação passo a passo','Escolha uma pergunta e aprofunde até o documento oficial.',()=>openEvidence(e.id)))});
primaryByCase.sitio.push('autos0','hcforo','autos4');primaryByCase.triplex.push('autos1','autos3');primaryByCase.odebrecht.push('rclportal');primaryByCase.instituto.push('rclportal');primaryByCase.dirceu=['autos5','autos6','autos7','autos8'];
document.querySelectorAll('.metrics span').forEach(s=>{if(s.textContent.includes('fontes'))s.previousElementSibling.textContent=Object.keys(D.sources).length});
document.querySelectorAll('.node,.edge.hit').forEach(el=>{el.addEventListener('mouseleave',()=>restoreHighlight());el.addEventListener('blur',()=>restoreHighlight())});
</script>
